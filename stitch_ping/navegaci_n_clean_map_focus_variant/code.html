<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Ping - Navegación</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#dbd9db",
                    "on-tertiary-container": "#a88c69",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#38485a",
                    "primary-fixed": "#d2e4fb",
                    "surface-variant": "#e4e2e3",
                    "tertiary-container": "#38260b",
                    "tertiary-fixed": "#feddb5",
                    "inverse-on-surface": "#f2f0f2",
                    "on-secondary-fixed": "#001a41",
                    "primary-container": "#1a2b3c",
                    "on-tertiary-fixed": "#281802",
                    "outline": "#74777d",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#211200",
                    "error": "#ba1a1a",
                    "secondary-container": "#0070eb",
                    "background": "#fbf9fa",
                    "on-background": "#1b1c1d",
                    "surface-container-low": "#f5f3f4",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#fbf9fa",
                    "secondary-fixed": "#d8e2ff",
                    "on-secondary-fixed-variant": "#004493",
                    "outline-variant": "#c4c6cd",
                    "inverse-surface": "#303032",
                    "secondary": "#0058bc",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#584326",
                    "primary-fixed-dim": "#b7c8de",
                    "surface-container-high": "#e9e7e9",
                    "on-primary-fixed": "#0b1d2d",
                    "on-surface-variant": "#44474c",
                    "inverse-primary": "#b7c8de",
                    "secondary-fixed-dim": "#adc6ff",
                    "on-secondary-container": "#fefcff",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-container": "#efedef",
                    "tertiary-fixed-dim": "#e1c29b",
                    "surface": "#fbf9fa",
                    "surface-tint": "#4f6073",
                    "surface-container-highest": "#e4e2e3",
                    "on-surface": "#1b1c1d",
                    "on-secondary": "#ffffff",
                    "primary": "#041627",
                    "on-primary-container": "#8192a7"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-page": "20px",
                    "safe-area-bottom": "34px",
                    "gutter-grid": "16px",
                    "stack-sm": "8px",
                    "stack-md": "16px",
                    "touch-target-min": "48px",
                    "stack-lg": "24px"
            },
            "fontFamily": {
                    "body-sm": [
                            "Inter"
                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "headline-lg": [
                            "Inter"
                    ],
                    "headline-lg-mobile": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Inter"
                    ],
                    "label-caps": [
                            "JetBrains Mono"
                    ],
                    "status-number": [
                            "JetBrains Mono"
                    ]
            },
            "fontSize": {
                    "body-sm": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "400"
                            }
                    ],
                    "body-lg": [
                            "17px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg-mobile": [
                            "24px",
                            {
                                    "lineHeight": "30px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-md": [
                            "20px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "600"
                            }
                    ],
                    "label-caps": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "600"
                            }
                    ],
                    "status-number": [
                            "18px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "500"
                            }
                    ]
            }
    },
        },
      }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            overscroll-behavior-y: none;
        }
        
        /* Map pattern overlay */
        .map-pattern {
            background-image: 
                radial-gradient(theme('colors.outline-variant') 1px, transparent 1px),
                radial-gradient(theme('colors.outline-variant') 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.3;
        }

        .shadow-ambient {
            box-shadow: 0 4px 12px rgba(4, 22, 39, 0.15);
        }
    </style>
</head>
<body class="flex flex-col h-screen md:hidden overflow-hidden">
<!-- Map Area (Top 70%) -->
<main class="flex-none relative h-[70vh] bg-surface-container-low">
<!-- Minimalist Map Background -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A clean, minimalist 2D digital map interface designed for an autonomous vehicle display. The map uses a very light gray and white color palette to match a bright, modern light-mode aesthetic. Roads are depicted as crisp, thin white lines on a soft gray background. The scene is illuminated evenly, avoiding any harsh shadows, conveying a sense of precise, high-tech reliability and focused navigation without clutter." style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuAfQdsoKBFY_35xWpE3_IQRg5vDh8rRk5we06kFumPhluIcfJjVvPifeZPIecjaw_4LyyOalPrycnZx4jwb9yFsySbjNZ88Nn9qwe6y39grsFi_14bATWWIFAGLQj9UWjAM5SeyrFGA_SLx2Q-ITlkSIgV0B_rqv94IH_oAAwrjyZDXtilhV1dtSwzI0TMM9l8aZc6ZoRreOdslpb0mRCenJPlQGohIWAgOeC-6E2__37XUY8V2Afe3&quot;);"></div>
<div class="absolute inset-0 map-pattern pointer-events-none"></div>
<!-- Floating Button: Destinos Previos -->
<div class="absolute top-safe pt-stack-md right-margin-page z-10 mt-4">
<button class="bg-surface-container-lowest text-on-surface flex items-center gap-2 px-4 py-2 rounded-full shadow-ambient hover:bg-surface-container-high transition-colors min-h-[48px]">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: &quot;FILL&quot; 0;">history</span>
<span class="font-label-caps text-label-caps">Destinos Previos</span>
</button>
</div>
<!-- Center Vehicle Icon -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 flex flex-col items-center">
<div class="w-12 h-12 bg-secondary rounded-full flex items-center justify-center shadow-ambient border-4 border-surface-container-lowest relative">
<span class="material-symbols-outlined text-on-secondary" style="font-variation-settings: &quot;FILL&quot; 1;">directions_car</span>
<!-- Radar pulse effect -->
<div class="absolute inset-0 rounded-full border-2 border-secondary animate-ping opacity-50"></div>
</div>
</div>
</main>
<!-- Bottom Control Area (Bottom 30%) -->
<div class="flex-1 bg-surface-container-lowest rounded-t-3xl shadow-[0_-8px_24px_rgba(4,22,39,0.08)] z-20 flex flex-col relative -mt-6">
<!-- Pull Handle -->
<div class="flex justify-center pt-3 pb-4">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-page flex-1 flex flex-col justify-center pb-[100px]">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-md">Destino</h2>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-sm w-full">
<button class="w-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps h-[56px] rounded-xl flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">search</span>
                        Seleccionar Ruta
                    </button>
<!-- Disabled Primary Button -->
<button class="w-full bg-surface-container text-outline font-headline-md text-headline-md h-[56px] rounded-xl flex items-center justify-center gap-2 cursor-not-allowed opacity-70 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">route</span>
                        Iniciar Ruta
                    </button>
<button class="w-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps h-[56px] rounded-xl flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person_pin</span>
                        Búscame
                    </button></div>
</div>
</div>
<!-- BottomNavBar (from Shared Components JSON) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pt-2 pb-safe-area-bottom bg-surface-container-lowest shadow-[0_-4px_12px_rgba(4,22,39,0.15)] rounded-t-xl">
<!-- Inicio -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: &quot;FILL&quot; 0;">home</span>
<span class="font-label-caps text-label-caps">Inicio</span>
</a>
<!-- Navegación (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: &quot;FILL&quot; 1;">explore</span>
<span class="font-label-caps text-label-caps">Navegación</span>
</a>
<!-- Telemetría -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: &quot;FILL&quot; 0;">analytics</span>
<span class="font-label-caps text-label-caps">Telemetría</span>
</a>
<!-- Visión -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: &quot;FILL&quot; 0;">visibility</span>
<span class="font-label-caps text-label-caps">Visión</span>
</a>
<!-- Perfil -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: &quot;FILL&quot; 0;">person</span>
<span class="font-label-caps text-label-caps">Perfil</span>
</a>
</nav>




</body></html>
