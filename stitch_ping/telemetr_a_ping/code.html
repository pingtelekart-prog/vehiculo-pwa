<!DOCTYPE html><html class="light" lang="es" style=""><head>

<style>
        .semi-circle-gauge {
            width: 100%;
            height: 0;
            padding-bottom: 50%;
            position: relative;
            overflow: hidden;
        }
        .gauge-background {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: -100%;
            border-radius: 50%;
            border: 12px solid theme('colors.surface-container-high');
            border-bottom-color: transparent;
        }
        .gauge-fill-speed {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: -100%;
            border-radius: 50%;
            border: 12px solid theme('colors.secondary');
            border-bottom-color: transparent;
            transform: rotate(-135deg); /* Example 45% */
            transition: transform 1s ease-out;
        }
        .gauge-fill-accel {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: -100%;
            border-radius: 50%;
            border: 12px solid theme('colors.primary');
            border-bottom-color: transparent;
            transform: rotate(-90deg); /* Example 50% */
            transition: transform 1s ease-out;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-lg flex flex-col pt-[48px] pb-[100px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-touch-target-min bg-background/80 backdrop-blur-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: &quot;FILL&quot; 1;">directions_car</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold tracking-tighter text-primary">PING</h1>
<button class="flex items-center justify-center w-[48px] h-[48px] hover:opacity-80 transition-opacity active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">sensors</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow px-margin-page py-stack-lg flex flex-col gap-stack-lg overflow-y-auto">
<!-- Top Row: Gauges -->
<div class="grid grid-cols-2 gap-gutter-grid">
<!-- Speed Gauge -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-[0_4px_12px_rgba(4,22,39,0.05)] border border-surface-container-highest flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-stack-sm">Velocidad</span>
<div class="flex justify-center mb-2"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0653u421ov165enycvj-K5c6ndpbPnuJPhul8P-kYJSROkMhQISSkFW8ul8_dv1rX73Z3MxcltDbUPcBsWYbt5chyyyvEg9nw9AGl2QB9UpJ7_QrR6K81o7XU8GEYUI1ZY4RRnr9ZJ-7xMms6GMrwWuxnS-krPI6yGrPqoAoSmEZwS1cfAZkUSjby67X7rL58xrmeSu5DHp2YyumZDl9mlav-PYYQcpNG2lZJwOnskeBB-IJUkZyl" alt="Velocidad Gauge" class="h-24 w-auto object-contain"></div>
<div class="mt-[-20px] text-center"><span class="font-status-number text-status-number text-on-background">45</span><span class="font-label-caps text-label-caps text-outline ml-1">km/h</span></div>
</div>
<!-- Acceleration Gauge -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-[0_4px_12px_rgba(4,22,39,0.05)] border border-surface-container-highest flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-stack-sm">Aceleración</span>
<div class="flex justify-center mb-2"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBiikSfYeGLMxZE3bt7cnMQqWlqJX2A_XY0RMeIAH8pWMbnUkX2nIgraPgtVsoN15K_hKQCyowrWne7PGON_z8wWsG9PBHForPi5MCZD_f7DujB2PtDjbkzNbG7LW7NbjbLk-vRCdOQfKs09czTzO4tCQkC031mV9CfDwIrrF39-EHAhD0KE-pLp7eqyoSK3dCMei9X-aqbAyETqysd3lUVDNEoMWv-Oq9dpqR8GOMsKgzjSI9EDyem" alt="Aceleración Gauge" class="h-24 w-auto object-contain"></div>
<div class="mt-[-20px] text-center"><span class="font-status-number text-status-number text-on-background">2.5</span><span class="font-label-caps text-label-caps text-outline ml-1">m/s²</span></div>
</div>
</div>
<!-- Middle Row: Bars -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-[0_4px_12px_rgba(4,22,39,0.05)] border border-surface-container-highest flex flex-col gap-stack-md">
<!-- Battery -->
<div>
<div class="flex justify-between items-center mb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" style="color: rgb(52, 199, 89);">battery_charging_full</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Batería</span>
</div>
<span class="font-status-number text-status-number text-on-background text-[14px]">85%</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full rounded-full" style="width: 85%; background-color: #34C759;"></div>
</div>
</div>
<!-- Fuel -->
<div>
<div class="flex justify-between items-center mb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] text-secondary">local_gas_station</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Combustible</span>
</div>
<span class="font-status-number text-status-number text-on-background text-[14px]">60%</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary rounded-full" style="width: 60%;"></div>
</div>
</div>
<!-- Temp -->
<div>
<div class="flex justify-between items-center mb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] text-error">thermostat</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Temperatura</span>
</div>
<span class="font-status-number text-status-number text-on-background text-[14px]">75°C</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full rounded-full bg-gradient-to-r from-secondary to-error" style="width: 75%;"></div>
</div>
</div>
</div>
<!-- Bottom Row: Odometer -->
<div class="bg-surface-container-lowest p-stack-lg rounded-xl shadow-[0_4px_12px_rgba(4,22,39,0.05)] border border-surface-container-highest flex flex-col items-center justify-center">

<div class="flex items-baseline gap-1">
<span class="font-status-number text-[32px] leading-tight font-bold text-on-background tracking-wider">1,245.3</span>
<span class="font-label-caps text-label-caps text-outline">km</span>
</div>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pt-2 pb-safe-area-bottom bg-surface-container-lowest shadow-[0_-4px_12px_rgba(4,22,39,0.15)] rounded-t-xl md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-colors">

</button>

</nav>

<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-label-caps">Inicio</span>
</button>
<button class="flex items-center gap-4 text-on-surface-variant p-3 rounded-lg hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">explore</span>
<span class="font-label-caps text-label-caps">Navegación</span>
</button>
<button class="flex items-center gap-4 bg-secondary-container text-on-secondary-container p-3 rounded-lg">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">analytics</span>

</button>
<button class="flex items-center gap-4 text-on-surface-variant p-3 rounded-lg hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">visibility</span>

</button>
<button class="flex items-center gap-4 text-on-surface-variant p-3 rounded-lg hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">person</span>
<span class="font-label-caps text-label-caps">Perfil</span>
</button>
</nav>


</body></html>
